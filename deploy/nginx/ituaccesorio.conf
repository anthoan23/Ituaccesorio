# Config de Nginx para el EC2 (instalado en el host, no en docker).
# Copiar a /etc/nginx/sites-available/ y cambiar TU_DOMINIO_AQUI por el dominio real.
# Despues de verificar el sitio en HTTP, `certbot --nginx` agrega el bloque 443 solo.
server {
    listen 80;
    server_name TU_DOMINIO_AQUI;

    # Subida de fotos desde el celular: hasta 20 fotos de 10 MB por lote
    client_max_body_size 210m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Notificaciones SSE: sin buffering y conexion viva por horas
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
