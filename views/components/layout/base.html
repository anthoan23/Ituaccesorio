<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
	<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/LOGO.png') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/modal.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/table-tools.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/notificaciones.css') }}">
	<title>{% block title %}Mi sitio{% endblock %}</title>
	{% block head_extra %}{% endblock %}
</head>
<body data-user-id="{{ g.user.usuario_id if g.user else '' }}">
	{% block navbar %}
		{% include 'components/layout/navbar.html' %}
	{% endblock %}

	<main>
		{% block content %}{% endblock %}
	</main>

	{% include 'components/ui/feedback_modal.html' %}

	<script src="{{ url_for('static', filename='js/modal.js') }}"></script>
	<script src="{{ url_for('static', filename='js/feedback-modal.js') }}" defer></script>
	<script src="{{ url_for('static', filename='js/table-tools.js') }}" defer></script>
	<script src="{{ url_for('static', filename='js/notificaciones.js') }}" defer></script>
	{% block scripts %}{% endblock %}
</body>
</html>
