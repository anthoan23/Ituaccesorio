<link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
<input class="nav-toggle" type="checkbox" id="nav-toggle" aria-hidden="true">

<header class="topbar">
	<div class="topbar__left">
		<label class="hamburger" for="nav-toggle" aria-label="Abrir menú" role="button" tabindex="0">
			<span class="hamburger__icon" aria-hidden="true">
				<span></span>
				<span></span>
				<span></span>
			</span>
		</label>

		<a class="brand" href="/" aria-label="Ir al inicio">
			<img class="brand__logo" src="{{ url_for('static', filename='img/LOGO TRAZO BLANCO.png') }}" alt="Ituaccesorio">
		</a>
	</div>

	<div class="topbar__right">
		<button class="icon-btn" type="button" aria-label="Notificaciones">
			<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
				<path d="M12 22a2.4 2.4 0 0 0 2.35-2H9.65A2.4 2.4 0 0 0 12 22Zm7-6V11a7 7 0 1 0-14 0v5l-2 2v1h18v-1l-2-2Z" fill="currentColor"/>
			</svg>
		</button>

		{% if g.user %}
		<div class="user">
			<span class="user__avatar" aria-hidden="true"></span>
			<div class="user__meta">
				<strong class="user__name">{{ g.user.usuario_nombre }}</strong>
				<span class="user__role">{{ g.user.nombre_rol }}</span>
			</div>
		</div>
		{% else %}
		<div class="user user--guest">
			<a class="btn btn--yellow" href="{{ url_for('login.pagina_login') }}">Iniciar sesión</a>
		</div>
		{% endif %}
	</div>
</header>

<label class="backdrop" for="nav-toggle" aria-label="Cerrar menú"></label>

<aside class="drawer" aria-label="Menú lateral">
	<div class="drawer__header">
		<span class="drawer__title">Menú</span>
	</div>

	<nav class="drawer__nav">
		<a class="drawer__link {% if active_page == 'dashboard' %}is-active{% endif %}" href="/">Dashboard</a>
		<a class="drawer__link" href="{{ url_for('empleados.pagina_empleados') }}">Empleados</a>
		<a class="drawer__link" href="{{ url_for('prueba.pagina_prueba') }}">Prueba DBs</a>
		<a class="drawer__link" href="{{ url_for('telefonos.pagina_telefonos') }}">Teléfonos</a>
		<a class="drawer__link" href="{{ url_for('productos.pagina_productos') }}">Productos</a>
		<a class="drawer__link {% if active_page == 'tradein' %}is-active{% endif %}" href="{{ url_for('tradein.pagina_tradein') }}">Trade-in</a>
		<a class="drawer__link {% if active_page == 'taller' %}is-active{% endif %}" href="{{ url_for('taller.pagina_taller') }}">Taller</a>
		<a class="drawer__link" href="{{ url_for('usuarios.pagina_usuarios') }}">Usuarios</a>
	</nav>
	
	<div class="drawer__footer">
		{% if g.user %}
			<form action="{{ url_for('login.logout') }}" method="GET">
				<button class="drawer__logout btn btn--ghost" type="submit">Cerrar sesión</button>
			</form>
		{% endif %}
	</div>

</aside>
