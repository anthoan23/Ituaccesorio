# Compose de produccion para EC2.
# Diferencias con docker-compose.yml (desarrollo):
#   - Sin volumen .:/app (el codigo vive dentro de la imagen, no hay hot reload)
#   - FLASK_DEBUG=0
#   - Gunicorn (CMD del Dockerfile)
#   - Las BDs NO exponen puertos al host: solo se alcanzan por la red interna
#     del compose, nadie de internet las ve.
#   - La web publica 5000 en el puerto 80 del host (mientras no haya Nginx;
#     cuando lo agreguemos, cambia a "127.0.0.1:5000:5000").
services:
  web:
    build: .
    restart: always
    ports:
      - "80:5000"
    env_file:
      - .env
    environment:
      - FLASK_DEBUG=0
      - DB_HOST1=db1
      - DB_HOST2=db2
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PASSWORD2=${DB_PASSWORD2}
      - DB_NAME1=${DB_NAME1}
      - DB_NAME2=${DB_NAME2}
    depends_on:
      db1:
        condition: service_healthy
      db2:
        condition: service_healthy

  db1:
    image: mysql:8.0
    restart: always
    command: --default-time-zone='-04:00'
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME1}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db1_data:/var/lib/mysql
      - ./bd/ituaccesoriobd.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  db2:
    image: mysql:8.0
    restart: always
    command: --default-time-zone='-04:00'
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME2}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD2}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db2_data:/var/lib/mysql
      - ./bd/seguridad.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  db1_data:
  db2_data:
